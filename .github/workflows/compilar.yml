# Compila Bajar Subtítulos ESP en Windows: pruebas, .exe, autoprueba, zip portable e instalador.
# - Al subir una etiqueta vX.Y.Z: además crea una Release (privada, como el repositorio) con ambos.
# - A mano (Actions › Compilar › Run workflow): solo deja los archivos como artefacto descargable.
name: Compilar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Dependencias
        run: python -m pip install -r requirements-build.txt

      - name: La etiqueta coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -I -c "import sys; sys.path.insert(0, '.'); import app; print(app.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con app.__version__ ($version)" }

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I -m unittest discover -s tests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar
        run: python -I packaging/compilar.py

      - uses: actions/upload-artifact@v7
        with:
          name: BajarSubtitulosESP-${{ github.ref_name }}
          path: |
            dist/*-portable.zip
            dist/*-instalador.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" (Get-Item dist/*-instalador.exe) (Get-Item dist/*-portable.zip) `
            --title "Bajar Subtítulos ESP ${{ github.ref_name }}" --generate-notes

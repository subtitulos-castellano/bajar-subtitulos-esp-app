# Bajar Subtítulos ESP: compila en Windows, prueba lo compilado en Windows 10 y 11, pasa las pruebas
# también en Linux y, con una etiqueta vX.Y.Z, publica la Release con SHA256SUMS.txt y la atestación de
# procedencia de cada archivo.
# - A mano (Actions › Compilar › Run workflow): compila y prueba; los archivos quedan como artefacto.
#
# Windows Server 2022 comparte base con Windows 10 (21H2) y Windows Server 2025 con Windows 11 (24H2).
name: Compilar

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compilar:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Dependencias
        run: python -m pip install -r requirements-build.txt

      - name: La etiqueta coincide con la versión de la app
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = python -I -c "import sys; sys.path.insert(0, '.'); import app; print(app.__version__)"
          if ("v$version" -ne "${{ github.ref_name }}") { throw "La etiqueta ${{ github.ref_name }} no coincide con app.__version__ ($version)" }

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -I -m unittest discover -s tests

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Compilar (incluye la autoprueba del .exe)
        run: python -I packaging/windows/compilar.py

      - uses: actions/upload-artifact@v7
        with:
          name: BajarSubtitulosESP-${{ github.ref_name }}
          path: |
            dist/*-portable.zip
            dist/*-instalador.exe
          if-no-files-found: error

  probar:
    needs: compilar
    strategy:
      fail-fast: false
      matrix:
        sistema: [windows-2022, windows-2025]
    runs-on: ${{ matrix.sistema }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Sistema
        shell: pwsh
        run: |
          $os = Get-CimInstance Win32_OperatingSystem
          "$($os.Caption) $($os.Version) (compilación $($os.BuildNumber))"

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-app.txt
          python -I -m unittest discover -s tests

      - uses: actions/download-artifact@v7
        with:
          name: BajarSubtitulosESP-${{ github.ref_name }}
          path: dist

      - name: Instalar, autoprueba y desinstalar
        shell: pwsh
        run: |
          function Autoprueba($exe, $informe) {
            $p = Start-Process $exe -ArgumentList '--autoprueba', $informe -Wait -PassThru
            Get-Content $informe
            if ($p.ExitCode -ne 0) { throw "Autoprueba fallida ($exe): código $($p.ExitCode)" }
          }
          # Una «portable» (otro programa que existe) tiene el menú, con el menú activado en la
          # configuración: el instalador debe quedárselo.
          function MenuDePortable {
            $k = 'HKCU:\Software\Classes\Directory\shell\BajarSubtitulosESP\shell\1solo\command'
            New-Item -Path $k -Force | Out-Null
            Set-Item -Path $k -Value "`"$env:SystemRoot\System32\notepad.exe`" --menu-carpeta `"%V`""
          }
          $config = Join-Path $env:APPDATA 'BajarSubtitulosEsp\config.json'
          New-Item -ItemType Directory -Force (Split-Path $config) | Out-Null
          '{"menu_contextual": true}' | Set-Content -Encoding utf8 $config
          MenuDePortable
          $dir = Join-Path $env:RUNNER_TEMP 'instalado'
          $instalador = (Get-Item dist/*-instalador.exe).FullName
          # Primera instalación en inglés (/LANG: lo mismo que elegir English en el instalador).
          $p = Start-Process $instalador -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir", '/NOICONS', '/LANG=en' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "El instalador ha fallado: código $($p.ExitCode)" }
          Autoprueba "$dir\BajarSubtitulosESP.exe" (Join-Path $env:RUNNER_TEMP 'instalado.txt')

          # Idioma: el de la instalación queda en la configuración, y el menú contextual sale en inglés.
          $idioma = (Get-Content -Raw $config | ConvertFrom-Json).idioma
          if ($idioma -ne 'en') { throw "El instalador no ha guardado el idioma elegido: $idioma" }
          $texto = (Get-ItemProperty 'HKCU:\Software\Classes\Directory\shell\BajarSubtitulosESP').MUIVerb
          if ($texto -ne 'Get subtitles here') { throw "Menú contextual en otro idioma: $texto" }

          # Menú contextual: lo añade el instalador (aunque fuera de la portable), apuntando al programa instalado.
          $carpetas = 'HKCU:\Software\Classes\Directory\shell\BajarSubtitulosESP\shell\1solo\command'
          $comando = if (Test-Path $carpetas) { (Get-ItemProperty $carpetas).'(default)' }
          if ($comando -ne "`"$dir\BajarSubtitulosESP.exe`" --menu-carpeta `"%V`"") { throw "Menú contextual de carpetas inesperado: $comando" }
          if (-not (Test-Path 'HKCU:\Software\Classes\SystemFileAssociations\.mkv\shell\BajarSubtitulosESP\command')) { throw 'Falta el menú contextual de los vídeos' }
          # Dos vídeos seleccionados: el Explorador abre la app dos veces a la vez; queda una sola, que
          # busca los dos.
          $videos = Join-Path $env:RUNNER_TEMP 'menu'
          python -I -c "import sys; sys.path.insert(0, '.'); from pathlib import Path; from app.main import _mkv_castellano; d = Path(sys.argv[1]); d.mkdir(); [(d / n).write_bytes(_mkv_castellano()) for n in ('A.S01E01.mkv', 'B.S01E02.mkv')]" $videos
          foreach ($n in 'A.S01E01.mkv', 'B.S01E02.mkv') { Start-Process "$dir\BajarSubtitulosESP.exe" -ArgumentList '--menu-archivos', "`"$videos\$n`"" }
          $fin = (Get-Date).AddSeconds(90)
          while (-not ((Test-Path "$videos\A.S01E01.srt") -and (Test-Path "$videos\B.S01E02.srt"))) {
            if ((Get-Date) -gt $fin) { throw 'Desde el menú contextual no se han guardado los subtítulos' }
            Start-Sleep -Seconds 1
          }
          Start-Sleep -Seconds 3
          $abiertas = @(Get-Process BajarSubtitulosESP -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\BajarSubtitulosESP.exe" })
          if ($abiertas.Count -ne 1) { throw "Debería quedar una sola app abierta y hay $($abiertas.Count)" }
          'Menú contextual correcto: dos aperturas, una sola app, dos subtítulos'
          $abiertas | Stop-Process -Force
          Start-Sleep -Seconds 3

          # Después se cambia a castellano en Configuración: al actualizar, el instalador no lo toca.
          $datos = Get-Content -Raw $config | ConvertFrom-Json
          $datos.idioma = 'es'
          $datos | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $config

          # Actualización como la hace la app al pulsar Actualizar: lanza el instalador en silencio y se
          # cierra; el instalador espera a que termine, instala encima y la vuelve a abrir.
          # (WaitForExit y no -Wait: -Wait esperaría también al instalador y a la app que este reabre.)
          $registro = Join-Path (Split-Path $instalador) 'instalacion.log'
          $p = Start-Process "$dir\BajarSubtitulosESP.exe" -ArgumentList '--probar-actualizacion', "`"$instalador`"" -PassThru
          $p.WaitForExit()
          if ($p.ExitCode -ne 0) { throw "La app no ha lanzado la actualización: código $($p.ExitCode)" }
          $fin = (Get-Date).AddMinutes(3)
          while (-not ((Test-Path $registro) -and (Select-String -Path $registro -Pattern 'Log closed' -Quiet))) {
            if ((Get-Date) -gt $fin) { if (Test-Path $registro) { Get-Content $registro }; throw 'El instalador no ha terminado' }
            Start-Sleep -Seconds 2
          }
          Get-Content $registro | Select-String -Pattern 'Setup version|Installation process succeeded|Need to restart|Exception|error'
          if (-not (Select-String -Path $registro -Pattern 'Installation process succeeded' -Quiet)) { Get-Content $registro; throw 'La actualización no se ha instalado' }
          $fin = (Get-Date).AddSeconds(60)
          while (-not ($reabierta = Get-Process BajarSubtitulosESP -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq "$dir\BajarSubtitulosESP.exe" })) {
            if ((Get-Date) -gt $fin) { throw 'La app no se ha vuelto a abrir tras actualizarse' }
            Start-Sleep -Seconds 1
          }
          'Actualización correcta: la app se ha vuelto a abrir sola'
          $idioma = (Get-Content -Raw $config | ConvertFrom-Json).idioma
          if ($idioma -ne 'es') { throw "La actualización ha cambiado el idioma elegido en Configuración: $idioma" }
          # Al abrirse, la app pone el menú contextual en su idioma.
          $fin = (Get-Date).AddSeconds(30)
          while (($texto = (Get-ItemProperty 'HKCU:\Software\Classes\Directory\shell\BajarSubtitulosESP').MUIVerb) -ne 'Bajar subtítulos aquí') {
            if ((Get-Date) -gt $fin) { throw "El menú contextual no ha pasado a castellano: $texto" }
            Start-Sleep -Seconds 1
          }
          'Idioma correcto: inglés al instalar, castellano tras cambiarlo y actualizar'
          $reabierta | Stop-Process -Force
          Start-Sleep -Seconds 3
          Autoprueba "$dir\BajarSubtitulosESP.exe" (Join-Path $env:RUNNER_TEMP 'actualizado.txt')

          # El desinstalador quita el menú aunque apunte a otra copia, y lo deja sin decidir.
          MenuDePortable
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          Start-Sleep -Seconds 8
          if (Test-Path "$dir\BajarSubtitulosESP.exe") { throw 'La desinstalación ha dejado el programa' }
          $clave = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{6F0C2D8E-3B7A-4E51-9C2F-8A1D5E7B4C93}_is1'
          if (Test-Path $clave) { throw 'La desinstalación ha dejado la entrada en el registro' }
          foreach ($menu in 'Directory\shell', 'Directory\Background\shell', 'Drive\shell', 'SystemFileAssociations\.mkv\shell') {
            if (Test-Path "HKCU:\Software\Classes\$menu\BajarSubtitulosESP") { throw "La desinstalación ha dejado el menú contextual ($menu)" }
          }
          if ((Get-Content -Raw $config | ConvertFrom-Json).menu_contextual -eq $true) { throw 'La desinstalación ha dejado el menú activado en la configuración' }
          'Instalación y desinstalación correctas'

      - name: Versión portable
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'portable'
          Expand-Archive (Get-Item dist/*-portable.zip).FullName -DestinationPath $dir
          $informe = Join-Path $env:RUNNER_TEMP 'portable.txt'
          $p = Start-Process "$dir\BajarSubtitulosESP\BajarSubtitulosESP.exe" -ArgumentList '--autoprueba', $informe -Wait -PassThru
          Get-Content $informe
          if ($p.ExitCode -ne 0) { throw "Autoprueba de la versión portable fallida: código $($p.ExitCode)" }

  # La app aún no se compila para Linux (llegará en la 1.5.0), pero el código ya se prueba en Linux.
  pruebas-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements-app.txt

      - name: Bibliotecas que Qt necesita
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Pruebas
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install -r requirements-app.txt
          python -I -m unittest discover -s tests

  publicar:
    needs: [probar, pruebas-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # crear la Release
      id-token: write      # atestación: identidad del workflow ante Sigstore
      attestations: write  # atestación: guardarla en el repositorio
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          name: BajarSubtitulosESP-${{ github.ref_name }}
          path: dist

      - name: Sumas SHA-256
        working-directory: dist
        run: |
          sha256sum *-instalador.exe *-portable.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Atestación de procedencia
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*-instalador.exe
            dist/*-portable.zip

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Novedades en castellano y, tras la marca <!-- en --> (la app enseña la parte de su idioma), en inglés.
          seccion() { awk -v v="${GITHUB_REF_NAME#v}" '$0 ~ "^## " v {s=1; next} /^## / {s=0} s' "$1"; }
          notas=$(seccion CHANGELOG.md)
          notas_en=$(seccion CHANGELOG.en.md)
          if [ -n "$notas_en" ]; then
            notas="${notas}"$'\n\n<!-- en -->\n\n### English\n\n'"${notas_en}"
          fi
          gh release create "$GITHUB_REF_NAME" dist/*-instalador.exe dist/*-portable.zip dist/SHA256SUMS.txt \
            --title "Bajar Subtítulos ESP $GITHUB_REF_NAME" --notes "${notas:-Ver CHANGELOG.md}"
